# Baut den Windows-Installer bei jedem Versions-Tag (v*) und veröffentlicht ihn als GitHub-Release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Installer bauen und veröffentlichen
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fester Download-Link (.../releases/latest/download/MoodleDesktop-Setup.exe) und blockmap für Differenz-Updates
      - name: Zusatzdateien anhängen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "out/MoodleDesktop-Setup-$version.exe" "out/MoodleDesktop-Setup.exe"
          gh release upload "v$version" "out/MoodleDesktop-Setup.exe" "out/MoodleDesktop-Setup-$version.exe.blockmap" --clobber
