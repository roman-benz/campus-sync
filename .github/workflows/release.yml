# Baut den Windows-Installer bei jedem Versions-Tag (v*) und veröffentlicht ihn als GitHub-Release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Nur bauen – das Hochladen übernimmt der nächste Schritt in einem Rutsch.
      # (electron-builder lädt Dateien parallel hoch und legt dabei gelegentlich zwei Releases an.)
      - name: Installer bauen
        run: npx electron-builder --win nsis --publish never

      # Ein Release mit allen Dateien: Installer, blockmap (Differenz-Updates), latest.yml (Auto-Update)
      # und der Installer unter festem Namen für .../releases/latest/download/MoodleDesktop-Setup.exe
      - name: Release veröffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "out/MoodleDesktop-Setup-$version.exe" "out/MoodleDesktop-Setup.exe"
          gh release create "v$version" `
            "out/MoodleDesktop-Setup-$version.exe" `
            "out/MoodleDesktop-Setup-$version.exe.blockmap" `
            "out/latest.yml" `
            "out/MoodleDesktop-Setup.exe" `
            --title "Moodle Desktop $version" --generate-notes
